
name: Create a comment on new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment-with-action:
    runs-on: self-hosted

    steps:
      - name: Create comment using GitHub Action
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello! 👋

            Your issue has been received successfully.
            This comment was automatically generated using GitHub Actions running on AWS EC2.

  comment-with-api:
    runs-on: self-hosted

    steps:
      - name: Create comment using GitHub API
        run: |
          gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -f body="Me too! This comment was posted using the GitHub CLI API."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
