
name: Test EC2 Self Hosted Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test EC2 runner
        run: |
          echo "Hello from AWS EC2!"
          echo "Hostname: $(hostname)"
          echo "Operating System:"
          cat /etc/os-release
          echo "Node version:"
          node -v
